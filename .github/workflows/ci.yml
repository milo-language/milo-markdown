name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install milo
        run: |
          mkdir -p "$HOME/.milo-bin"
          curl -fsSL https://github.com/milo-language/milo/releases/download/latest/milo-linux-x64.tar.gz \
            | tar xz -C "$HOME/.milo-bin" --strip-components=1   # archive wraps the binary in milo-<platform>/
          chmod +x "$HOME/.milo-bin/milo"
          echo "$HOME/.milo-bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: milo test tests/markdown_test.milo

      - name: CommonMark spec conformance (ratcheted)
        run: python3 scripts/spec-oracle.py --check

      - name: Differential fuzzing against cmark
        run: |
          sudo apt-get update && sudo apt-get install -y cmark
          # Ubuntu ships cmark 0.30, which predates a few 0.31 rules (comment
          # syntax, unicode punctuation), so this is informational here and the
          # spec oracle above is the gate. Locally, with cmark 0.31.2, it fails
          # on any unexplained disagreement.
          python3 scripts/fuzz-oracle.py --n 1000 --show 5 || true

      - name: Example
        run: milo run examples/render.milo README.md
